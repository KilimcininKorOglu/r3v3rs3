[package]
name = "r3v3rs3"
version.workspace = true
publish = false
edition.workspace = true
include = ["/src", "/templates", "/data", "/LICENSE", "/dist/webui"]
description = "A reverse proxy server with a built-in WebUI for TCP, UDP, TLS, HTTP, WebSocket and HTTP/3, and a deployment platform that runs your apps behind it."
authors = ["KilimcininKorOglu <k@keremgok.tr>", "picoHz <picoHz@outlook.com>"]
keywords = ["tcp", "http", "tls", "proxy", "reverse-proxy"]
categories = [
    "network-programming",
    "web-programming",
    "web-programming::websocket",
]
license.workspace = true
repository.workspace = true
homepage = "https://r3v3rs3.keremgok.tr/"
readme = "../README.md"
default-run = "r3-server"

[[bin]]
name = "r3-server"
path = "src/main.rs"

# The server code lives in the r3v3rs3-* crates; this package re-exports it and builds the
# binary. `data/`, `templates/` and `dist/webui` stay here and the crates embed them from here.
[dependencies]
r3v3rs3-admin.workspace = true
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
include_dir.workspace = true
r3v3rs3-api.workspace = true
rpassword.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
r3v3rs3-api = { workspace = true, features = ["test-util"] }
argon2.workspace = true
async-compression.workspace = true
async-trait.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
h3.workspace = true
h3-quinn.workspace = true
hex.workspace = true
hickory-proto.workspace = true
hickory-resolver.workspace = true
hmac.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
ipnet.workspace = true
libc.workspace = true
log.workspace = true
mockito.workspace = true
pkcs8.workspace = true
ppp.workspace = true
quinn.workspace = true
rand.workspace = true
rcgen.workspace = true
rmcp = { workspace = true, features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
reqwest = { workspace = true, features = [
    "form",
    "gzip",
    "brotli",
    "stream",
] }
rsa.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
socket2.workspace = true
tar.workspace = true
time.workspace = true
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
zstd.workspace = true
