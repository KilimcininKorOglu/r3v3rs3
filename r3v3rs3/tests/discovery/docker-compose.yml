# etcd for the ignored service discovery end-to-end tests.
# Run the tests with `make test-discovery-e2e`.
name: r3v3rs3-discovery

services:
  etcd:
    image: quay.io/coreos/etcd:v3.6.4
    command:
      - /usr/local/bin/etcd
      - --name=e2e
      - --data-dir=/tmp/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:8481
    ports:
      - "127.0.0.1:8481:2379"
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "endpoint", "health"]
      interval: 2s
      retries: 30
