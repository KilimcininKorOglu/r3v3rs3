[package]
name = "r3v3rs3-proxy"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The proxy handlers of the r3v3rs3 server: TCP, UDP, TLS, HTTP and QUIC, and the traffic security checks."
authors = ["KilimcininKorOglu <k@keremgok.tr>", "picoHz <picoHz@outlook.com>"]

[features]
# Builds the test helpers of this crate for the tests of the crates above it.
test-util = []

