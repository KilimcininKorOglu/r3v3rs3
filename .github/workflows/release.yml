name: Upload Release Assets

on:
  push:
    tags:
      - "v*"
  # A manual run builds the WebUI and both binaries and publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The WebUI is WebAssembly, so one build serves every target. This job also creates the draft
  # release once, before the binary jobs upload to it.
  webui:
    name: Build WebUI and create release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel and its
        # declared targets.
        run: rustup toolchain install
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0
      - name: Install trunk
        run: cargo binstall trunk@0.21.14 --force -y
      - name: Build webui
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release
      - name: Upload webui
        uses: actions/upload-artifact@v7
        with:
          name: webui
          path: r3v3rs3/dist/webui
          if-no-files-found: error
          retention-days: 1
      - name: Create release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]"{f=1;next} f&&/^## \[/{exit} f{print}' CHANGELOG.md > relnotes.md
          test -s relnotes.md
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --notes-file relnotes.md --draft

  # Each target builds on a native runner. Ubuntu 22.04 keeps the required glibc at 2.35.
  binary:
    name: Upload Release Assets (${{ matrix.target }})
    needs: webui
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: rustup toolchain install
      - name: Check host target
        run: test "$(rustc -vV | awk '/^host:/{print $2}')" = "${{ matrix.target }}"
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Download webui
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: webui
          path: r3v3rs3/dist/webui
      - name: Build project
        run: cargo build --release --locked -p r3v3rs3
      - name: Make archive
        run: tar -C target/release -Jcvf r3v3rs3-${{ matrix.target }}.tar.xz r3v3rs3
      - name: Upload archive
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" r3v3rs3-${{ matrix.target }}.tar.xz

  # Each musl target builds inside an Alpine container of the matching architecture, so the
  # static binary needs no cross toolchain. aws-lc-rs compiles its C code with cmake and perl.
  binary-musl:
    name: Upload Release Assets (${{ matrix.target }})
    needs: webui
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache
        # The build runs inside the container, so the registry and the target directory are
        # mounted from the runner and cached per target.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}-musl
      - name: Download webui
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: webui
          path: r3v3rs3/dist/webui
      - name: Build project
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -v "$HOME/.cargo:/root/.cargo" \
            rust:1-alpine sh -ec '
              apk add --no-cache musl-dev perl cmake make clang
              cargo build --release --locked -p r3v3rs3
            '
      - name: Check the static binary
        # A static PIE binary reports "static-pie linked" instead of "statically linked".
        run: file target/release/r3v3rs3 | grep -qE "statically|static-pie"
      - name: Make archive
        run: tar -C target/release -Jcvf r3v3rs3-${{ matrix.target }}.tar.xz r3v3rs3
      - name: Upload archive
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" r3v3rs3-${{ matrix.target }}.tar.xz

  test:
    name: Test
    uses: ./.github/workflows/rust.yml

  # Signs the checksums of the release assets, so a download verifies against the public key
  # that the repository carries in dist/minisign.pub.
  sign:
    name: Sign the checksums
    needs: [binary, binary-musl]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Write the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "the MINISIGN_SECRET_KEY secret is empty" >&2; exit 1; }
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          chmod 600 /tmp/minisign.key
      - name: Download the release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets
          rm -f assets/SHA256SUMS assets/SHA256SUMS.minisig
      - name: Sign the checksums
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        working-directory: assets
        run: |
          sha256sum --binary * > ../SHA256SUMS
          # minisign reads the password from stdin, not from the environment.
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm ../SHA256SUMS -s /tmp/minisign.key
      - name: Verify the signature
        working-directory: assets
        # The same command that the release verification docs give the users.
        run: minisign -Vm ../SHA256SUMS -p "$GITHUB_WORKSPACE/dist/minisign.pub"
      - name: Upload the checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS SHA256SUMS.minisig

  # crates.io trusted publishing exchanges the GitHub OIDC token for a short-lived token,
  # so the repository stores no crates.io secret.
  crates:
    name: Publish crates
    if: github.event_name == 'push'
    needs: [webui, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: rustup toolchain install
      - name: Download webui
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: webui
          path: r3v3rs3/dist/webui
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish r3v3rs3-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "r3v3rs3-api") | .version')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A "r3v3rs3-release (github.com/KilimcininKorOglu/r3v3rs3)" "https://crates.io/api/v1/crates/r3v3rs3-api/$version")
          case "$code" in
            200) echo "r3v3rs3-api $version is already published" ;;
            404) cargo publish -p r3v3rs3-api --locked ;;
            *) echo "crates.io returned $code for r3v3rs3-api $version" >&2; exit 1 ;;
          esac
      - name: Publish r3v3rs3
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # dist/webui is gitignored but the package ships it.
        run: cargo publish -p r3v3rs3 --locked --allow-dirty

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: [binary, crates, sign]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
