name: Upload Release Assets

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/release.yml"
  # A manual run builds the WebUI and all binaries and publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # The draft release exists before any job uploads to it. Keeping this out of the WebUI job
  # lets the CLI builds start without waiting for the Wasm build, which r3v3rs3-cli does not embed.
  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]"{f=1;next} f&&/^## \[/{exit} f{print}' CHANGELOG.md > relnotes.md
          test -s relnotes.md
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file relnotes.md --draft

  # The WebUI is WebAssembly, so one build serves every target.
  webui:
    name: Build WebUI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel and its
        # declared targets.
        run: rustup toolchain install
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install trunk
        run: cargo binstall trunk@0.21.14 --force -y
      - name: Cache
        # The WebUI builds in r3v3rs3-webui with its own wasm target, so its cache is
        # separate from the server caches of the binary jobs.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: r3v3rs3-webui
          shared-key: wasm-webui
      - name: Build webui
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release
      - name: Upload webui
        uses: actions/upload-artifact@v7
        with:
          name: webui
          path: r3v3rs3/dist/webui
          if-no-files-found: error
          retention-days: 1

  # One build per architecture serves every Linux: cargo zigbuild targets glibc 2.17, so the
  # glibc binary also runs on the older distributions, for example Rocky 8 or Debian 10, that
  # the glibc 2.35 build of the native runners could not serve. Zig also supplies the C
  # compiler, through which aws-lc-rs compiles its C code.
  binary:
    name: Upload Release Assets (${{ matrix.target }})
    if: always() && needs.webui.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    needs: [release, webui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install zig and cargo-zigbuild
        run: |
          python3 -m pip install ziglang==0.17.0
          cargo binstall cargo-zigbuild@0.23.4 --force -y
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}-2.17
      - name: Download webui
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: webui
          path: r3v3rs3/dist/webui
      - name: Build the server and the command line client for glibc 2.17
        run: cargo zigbuild --release --locked -p r3v3rs3 -p r3v3rs3-cli --target ${{ matrix.target }}.2.17
      - name: Make archives
        run: |
          tar -C "target/${{ matrix.target }}/release" -Jcvf r3v3rs3-${{ matrix.target }}.tar.xz r3v3rs3
          tar -C "target/${{ matrix.target }}/release" -zcvf r3v3rs3-cli-${{ matrix.target }}.tar.gz r3v3rs3-cli
      - name: Upload archives
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber r3v3rs3-${{ matrix.target }}.tar.xz r3v3rs3-cli-${{ matrix.target }}.tar.gz

  # The main push already ran the Rust workflow for this commit. The release runs the test
  # suite again only when that proof is missing, for example on a moved or older tag. A Rust
  # run that is still queued or in progress is worth waiting for, so the gate polls for it
  # before it decides to test again.
  test-gate:
    name: Test gate
    runs-on: ubuntu-24.04
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Check for a green Rust run of this commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Rust --commit "$GITHUB_SHA" --json conclusion,status)
            if [ "$(echo "$runs" | jq 'length')" -eq 0 ]; then
              echo "this commit has no Rust run, the tests run here"
              echo "tested=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            conclusion=$(echo "$runs" | jq -r '[.[] | select(.status == "completed")] | map(.conclusion) | sort | last // "running"')
            case "$conclusion" in
              success)
                echo "the Rust run of $GITHUB_SHA is green, the tests are skipped"
                echo "tested=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              failure | cancelled | startup_failure | timed_out)
                echo "the Rust run of $GITHUB_SHA is $conclusion" >&2
                echo "tested=false" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            echo "the Rust run of $GITHUB_SHA is not finished yet ($i/40)"
            sleep 30
          done
          echo "no finished Rust run of $GITHUB_SHA within 20 minutes" >&2
          echo "tested=false" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: test-gate
    if: needs.test-gate.outputs.tested != 'true'
    uses: ./.github/workflows/rust.yml

  # Signs the checksums of the release assets, so a download verifies against the public key
  # that the repository carries in dist/minisign.pub.
  sign:
    name: Sign the checksums
    needs: [binary, binary-cli]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Write the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "the MINISIGN_SECRET_KEY secret is empty" >&2; exit 1; }
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          chmod 600 /tmp/minisign.key
      - name: Download the release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets
          rm -f assets/SHA256SUMS assets/SHA256SUMS.minisig
      - name: Sign the checksums
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        working-directory: assets
        run: |
          sha256sum --binary ./* > ../SHA256SUMS
          # minisign reads the password from stdin, not from the environment.
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm ../SHA256SUMS -s /tmp/minisign.key
      - name: Verify the signature
        working-directory: assets
        # The same command that the release verification docs give the users.
        run: minisign -Vm ../SHA256SUMS -p "$GITHUB_WORKSPACE/dist/minisign.pub"
      - name: Upload the checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS SHA256SUMS.minisig

  # The command line client also runs on macOS, Windows, and static musl Linux systems.
  # Because it embeds no WebUI, all of these builds run in parallel immediately without waiting for webui.
  binary-cli:
    name: Upload Release Assets (r3v3rs3-cli, ${{ matrix.target }})
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            archive: tar.gz
            zigbuild: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
            zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
            zigbuild: false
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
            zigbuild: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: rustup toolchain install
      - name: Add the target
        run: rustup target add "${{ matrix.target }}"
      - name: Install zig and cargo-zigbuild
        if: matrix.zigbuild
        run: |
          python3 -m pip install ziglang==0.17.0
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cargo-zigbuild@0.23.4 --force -y
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}-cli
      - name: Build the command line client (native)
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --locked -p r3v3rs3-cli --target ${{ matrix.target }}
      - name: Build the command line client (zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --locked -p r3v3rs3-cli --target ${{ matrix.target }}
      - name: Make archive
        if: matrix.archive == 'tar.gz'
        run: tar -C "target/${{ matrix.target }}/release" -zcvf r3v3rs3-cli-${{ matrix.target }}.tar.gz r3v3rs3-cli
      - name: Make archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/r3v3rs3-cli.exe" -DestinationPath "r3v3rs3-cli-${{ matrix.target }}.zip"
      - name: Upload the archive
        if: startsWith(github.ref, 'refs/tags/v') && matrix.archive == 'tar.gz'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --clobber "r3v3rs3-cli-${{ matrix.target }}.tar.gz"
      - name: Upload the archive
        if: startsWith(github.ref, 'refs/tags/v') && matrix.archive == 'zip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The default shell here is pwsh, where $GITHUB_REF_NAME is not a PowerShell
        # variable, so the tag comes from the context.
        run: gh release upload "${{ github.ref_name }}" --clobber "r3v3rs3-cli-${{ matrix.target }}.zip"

  publish:
    name: Publish release
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.binary.result == 'success' && needs.binary-cli.result == 'success' && needs.sign.result == 'success' && needs.test-gate.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    needs: [binary, binary-cli, sign, test-gate, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
