on:
  push:
    tags:
      - "v*"

name: Upload Release Assets

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    name: Upload Release Assets (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: rui314/setup-mold@v1
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.3
      - name: Install trunk
        run: cargo binstall trunk --force -y
      - name: Add toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Build webui
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release
      - name: Build project
        run: cargo b --bin r3v3rs3 --release
      - name: Make archive
        run: tar -C target/release -Jcvf r3v3rs3-x86_64-unknown-linux-gnu.tar.xz r3v3rs3
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes --draft
        continue-on-error: true
      - name: Upload archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} *.tar.*

  release-windows:
    name: Upload Release Assets (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: msys2/setup-msys2@v2
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.3
      - name: Install trunk
        run: cargo binstall trunk --force -y
      - name: Add toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Build webui
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release && cargo clean
      - name: Build project
        run: cargo b --bin r3v3rs3 --release
      - name: Make archive
        run: tar -C target/release -acf r3v3rs3-x86_64-pc-windows-msvc.zip r3v3rs3.exe
      - name: Make archive
        run: msys2 -c 'cp target/release/r3v3rs3.exe . && tar cf r3v3rs3-x86_64-pc-windows-msvc.tar r3v3rs3.exe && xz *.tar'
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes --draft
        continue-on-error: true
      - name: Upload archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} r3v3rs3-x86_64-pc-windows-msvc.zip r3v3rs3-x86_64-pc-windows-msvc.tar.xz

  release-macos:
    name: Upload Release Assets (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.3
      - name: Install trunk
        run: cargo binstall trunk --force -y
      - name: Add toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Build webui
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release
      - name: Build project
        run: cargo b --bin r3v3rs3 --release
      - name: Make archive
        run: tar -C target/release -Jcvf r3v3rs3-x86_64-apple-darwin.tar.xz r3v3rs3
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes --draft
        continue-on-error: true
      - name: Upload archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} *.tar.*

  release-macos-cross:
    name: Upload Release Assets (macOS)
    strategy:
      matrix:
        toolchain: [aarch64-apple-darwin]
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.toolchain }}-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install toolchain
        run: rustup target add ${{ matrix.toolchain }}
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.3
      - name: Install trunk
        run: cargo binstall trunk --force -y
      - name: Add toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Build webui
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release
      - name: Build project
        run: cargo b --bin r3v3rs3 --release --target ${{ matrix.toolchain }}
      - name: Make archive
        run: tar -C target/${{ matrix.toolchain }}/release -Jcvf r3v3rs3-${{ matrix.toolchain }}.tar.xz r3v3rs3
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes --draft
        continue-on-error: true
      - name: Upload archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} *.tar.*

  release-cross:
    strategy:
      matrix:
        toolchain:
          [
            aarch64-unknown-linux-gnu,
            armv7-unknown-linux-gnueabihf,
          ]
    name: Upload Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.toolchain }}-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.10.3
      - name: Install trunk
        run: cargo binstall trunk --force -y
      - name: Install cross
        run: cargo binstall cross --force -y
      - name: Add toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Build webui
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release && cargo clean
      - name: Build project
        run: cross build -p r3v3rs3 --release --target ${{ matrix.toolchain }}
      - name: Make archive
        run: tar -C target/${{ matrix.toolchain }}/release -Jcvf r3v3rs3-${{ matrix.toolchain }}.tar.xz r3v3rs3
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --generate-notes --draft
        continue-on-error: true
      - name: Upload archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} *.tar.*
  release-freebsd:
    name: Upload Release Assets (FreeBSD)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v3
      continue-on-error: true
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-x86_64-unknown-freebsd-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Install cargo-binstall
      uses: cargo-bins/cargo-binstall@v1.10.3
    - name: Install trunk
      run: cargo binstall trunk --force -y
    - name: Add toolchain
      run: rustup target add wasm32-unknown-unknown
    - name: Build webui
      run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release && cargo clean
    - name: Build for FreeBSD
      id: build
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        envs: 'CARGO_TERM_COLOR'
        prepare: |
          pkg install -y curl gcc
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        run: |
          . "$HOME/.cargo/env"
          cargo b --bin r3v3rs3 --release
          tar -C target/release -Jcvf r3v3rs3-x86_64-unknown-freebsd.tar.xz r3v3rs3
          cargo clean
    - name: Create release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release create ${{ github.ref_name }} --generate-notes --draft
      continue-on-error: true
    - name: Upload archive
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload ${{ github.ref_name }} *.tar.*
