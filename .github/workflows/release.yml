name: Upload Release Assets

on:
  push:
    tags:
      - "v*"
  # A manual run builds the WebUI and both binaries and publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The draft release exists before any job uploads to it. Keeping this out of the WebUI job
  # lets the macOS and Windows MCP builds start without waiting for the Wasm build, which
  # r3v3rs3-cli does not embed.
  release:
    name: Create release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]"{f=1;next} f&&/^## \[/{exit} f{print}' CHANGELOG.md > relnotes.md
          test -s relnotes.md
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --notes-file relnotes.md --draft

  # The WebUI is WebAssembly, so one build serves every target.
  webui:
    name: Build WebUI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel and its
        # declared targets.
        run: rustup toolchain install
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install trunk
        run: cargo binstall trunk@0.21.14 --force -y
      - name: Cache
        # The WebUI builds in r3v3rs3-webui with its own wasm target, so its cache is
        # separate from the server caches of the binary jobs.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: r3v3rs3-webui
          key: wasm
      - name: Build webui
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release
      - name: Upload webui
        uses: actions/upload-artifact@v7
        with:
          name: webui
          path: r3v3rs3/dist/webui
          if-no-files-found: error
          retention-days: 1

  # One build per architecture serves every Linux: cargo zigbuild targets glibc 2.17, so the
  # glibc binary also runs on the older distributions, for example Rocky 8 or Debian 10, that
  # the glibc 2.35 build of the native runners could not serve. Zig also supplies the C
  # compiler, through which aws-lc-rs compiles its C code. The command line client additionally
  # builds against musl, because install-cli.sh offers the static build on the musl systems.
  binary:
    name: Upload Release Assets (${{ matrix.target }})
    needs: [release, webui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            musl: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-gnu
            musl: aarch64-unknown-linux-musl
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}" "${{ matrix.musl }}"
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install zig and cargo-zigbuild
        run: |
          python3 -m pip install ziglang==0.17.0
          cargo binstall cargo-zigbuild@0.23.4 --force -y
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}-2.17
      - name: Download webui
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: webui
          path: r3v3rs3/dist/webui
      - name: Build the server and the command line client for glibc 2.17
        run: cargo zigbuild --release --locked -p r3v3rs3 -p r3v3rs3-cli --target ${{ matrix.target }}.2.17
      - name: Build the command line client for musl
        run: cargo zigbuild --release --locked -p r3v3rs3-cli --target ${{ matrix.musl }}
      - name: Make archive
        run: tar -C "target/${{ matrix.target }}/release" -Jcvf r3v3rs3-${{ matrix.target }}.tar.xz r3v3rs3
      - name: Make the archives of the command line client
        run: |
          tar -C "target/${{ matrix.target }}/release" -zcvf r3v3rs3-cli-${{ matrix.target }}.tar.gz r3v3rs3-cli
          tar -C "target/${{ matrix.musl }}/release" -zcvf r3v3rs3-cli-${{ matrix.musl }}.tar.gz r3v3rs3-cli
      - name: Upload archive
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" r3v3rs3-${{ matrix.target }}.tar.xz r3v3rs3-cli-${{ matrix.target }}.tar.gz r3v3rs3-cli-${{ matrix.musl }}.tar.gz

  test:
    name: Test
    uses: ./.github/workflows/rust.yml

  # Signs the checksums of the release assets, so a download verifies against the public key
  # that the repository carries in dist/minisign.pub.
  sign:
    name: Sign the checksums
    needs: [binary, binary-cli]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      - name: Write the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "the MINISIGN_SECRET_KEY secret is empty" >&2; exit 1; }
          printf '%s\n' "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          chmod 600 /tmp/minisign.key
      - name: Download the release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir assets
          rm -f assets/SHA256SUMS assets/SHA256SUMS.minisig
      - name: Sign the checksums
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        working-directory: assets
        run: |
          sha256sum --binary ./* > ../SHA256SUMS
          # minisign reads the password from stdin, not from the environment.
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm ../SHA256SUMS -s /tmp/minisign.key
      - name: Verify the signature
        working-directory: assets
        # The same command that the release verification docs give the users.
        run: minisign -Vm ../SHA256SUMS -p "$GITHUB_WORKSPACE/dist/minisign.pub"
      - name: Upload the checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS SHA256SUMS.minisig

  # crates.io trusted publishing exchanges the GitHub OIDC token for a short-lived token,
  # so the repository stores no crates.io secret.
  crates:
    name: Publish crates
    if: github.event_name == 'push'
    needs: [webui, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: rustup toolchain install
      - name: Download webui
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: webui
          path: r3v3rs3/dist/webui
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish r3v3rs3-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "r3v3rs3-api") | .version')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A "r3v3rs3-release (github.com/KilimcininKorOglu/r3v3rs3)" "https://crates.io/api/v1/crates/r3v3rs3-api/$version")
          case "$code" in
            200) echo "r3v3rs3-api $version is already published" ;;
            404) cargo publish -p r3v3rs3-api --locked ;;
            *) echo "crates.io returned $code for r3v3rs3-api $version" >&2; exit 1 ;;
          esac
      - name: Publish r3v3rs3
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # The same already-published check as r3v3rs3-api, so a rerun of a release whose
        # crates went out in an earlier attempt closes the release instead of failing here.
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "r3v3rs3") | .version')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A "r3v3rs3-release (github.com/KilimcininKorOglu/r3v3rs3)" "https://crates.io/api/v1/crates/r3v3rs3/$version")
          case "$code" in
            200) echo "r3v3rs3 $version is already published" ;;
            404) cargo publish -p r3v3rs3 --locked --allow-dirty ;;
            *) echo "crates.io returned $code for r3v3rs3 $version" >&2; exit 1 ;;
          esac

  # The command line client also runs on the laptop of the admin, so macOS and Windows get
  # their own archives. The server itself stays Linux only.
  binary-cli:
    name: Upload Release Assets (r3v3rs3-cli, ${{ matrix.target }})
    # The command line client embeds no WebUI, so it only waits for the draft release.
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: rustup toolchain install
      - name: Add the target
        run: rustup target add "${{ matrix.target }}"
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}-cli
      - name: Build the command line client
        run: cargo build --release --locked -p r3v3rs3-cli --target ${{ matrix.target }}
      - name: Make archive
        if: matrix.archive == 'tar.gz'
        run: tar -C "target/${{ matrix.target }}/release" -zcvf r3v3rs3-cli-${{ matrix.target }}.tar.gz r3v3rs3-cli
      - name: Make archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/r3v3rs3-cli.exe" -DestinationPath "r3v3rs3-cli-${{ matrix.target }}.zip"
      - name: Upload the archive
        if: github.event_name == 'push' && matrix.archive == 'tar.gz'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "r3v3rs3-cli-${{ matrix.target }}.tar.gz"
      - name: Upload the archive
        if: github.event_name == 'push' && matrix.archive == 'zip'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The default shell here is pwsh, where $GITHUB_REF_NAME is not a PowerShell
        # variable, so the tag comes from the context.
        run: gh release upload "${{ github.ref_name }}" "r3v3rs3-cli-${{ matrix.target }}.zip"

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: [binary, binary-cli, crates, sign]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
