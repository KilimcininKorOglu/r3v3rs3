on:
  push:
    tags:
      - "v*"

name: Upload Release Assets

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-linux:
    name: Upload Release Assets (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: rui314/setup-mold@v1
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0
      - name: Install trunk
        run: cargo binstall trunk --force -y
      - name: Add toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Build webui
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release
      - name: Build project
        run: cargo b --bin r3v3rs3 --release
      - name: Make archive
        run: tar -C target/release -Jcvf r3v3rs3-x86_64-unknown-linux-gnu.tar.xz r3v3rs3
      - name: Create release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]"{f=1;next} f&&/^## \[/{exit} f{print}' CHANGELOG.md > relnotes.md
          test -s relnotes.md
          gh release create "$GITHUB_REF_NAME" --notes-file relnotes.md --draft
        continue-on-error: true
      - name: Upload archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} *.tar.*

  release-cross:
    strategy:
      matrix:
        toolchain:
          [
            aarch64-unknown-linux-gnu,
            armv7-unknown-linux-gnueabihf,
          ]
    name: Upload Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - uses: actions/cache@v3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.toolchain }}-stable-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.23.0
      - name: Install trunk
        run: cargo binstall trunk --force -y
      - name: Install cross
        run: cargo binstall cross --force -y
      - name: Add toolchain
        run: rustup target add wasm32-unknown-unknown
      - name: Build webui
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release && cargo clean
      - name: Build project
        run: cross build -p r3v3rs3 --release --target ${{ matrix.toolchain }}
      - name: Make archive
        run: tar -C target/${{ matrix.toolchain }}/release -Jcvf r3v3rs3-${{ matrix.toolchain }}.tar.xz r3v3rs3
      - name: Create release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]"{f=1;next} f&&/^## \[/{exit} f{print}' CHANGELOG.md > relnotes.md
          test -s relnotes.md
          gh release create "$GITHUB_REF_NAME" --notes-file relnotes.md --draft
        continue-on-error: true
      - name: Upload archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} *.tar.*
