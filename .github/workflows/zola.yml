name: Deploy Zola site to Pages

on:
  # The github-pages environment accepts deployments from main. A docs commit deploys at once, so
  # a documentation fix does not wait for the next release. A `paths` filter also applies to a tag
  # push, and a release commit rarely touches docs/, so the tag trigger is gone. Use
  # workflow_dispatch to deploy without a docs change.
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/zola.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, and let an in-progress deployment finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      #  The base_url output of configure-pages carries the scheme of the Pages settings, and it
      #  stayed http after the custom domain was added. sitemap.xml and og:url take that scheme, so
      #  the build uses the base_url of config.toml instead.
      - name: Build with Zola
        run: zola -r docs build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # IndexNow tells Bing (which powers ChatGPT web search) that the docs changed. The key file
      # sits at the site root, so Bing verifies ownership by fetching it. The key must equal the
      # name and the content of docs/static/<key>.txt, so a key change touches three places:
      # the secret, the file name and the file content.
      - name: Submit the docs to IndexNow
        env:
          KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
            --data-urlencode "url=https://r3v3rs3.keremgok.tr/" \
            --data-urlencode "key=${KEY}" \
            --data-urlencode "keyLocation=https://r3v3rs3.keremgok.tr/${KEY}.txt" \
            -G "https://api.indexnow.org/indexnow")
          echo "IndexNow answered ${code}: $(cat /tmp/indexnow.out)"
          [ "$code" = 200 ] || [ "$code" = 202 ]
