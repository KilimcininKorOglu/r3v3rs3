name: Deploy Zola site to Pages

on:
  # The github-pages environment accepts deployments from main. A docs commit deploys at once, so
  # a documentation fix does not wait for the next release. A `paths` filter also applies to a tag
  # push, and a release commit rarely touches docs/, so the tag trigger is gone. Use
  # workflow_dispatch to deploy without a docs change.
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/zola.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, and let an in-progress deployment finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.19.2
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      #  The base_url output of configure-pages carries the scheme of the Pages settings, and it
      #  stayed http after the custom domain was added. sitemap.xml and og:url take that scheme, so
      #  the build uses the base_url of config.toml instead.
      - name: Build with Zola
        run: zola -r docs build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
