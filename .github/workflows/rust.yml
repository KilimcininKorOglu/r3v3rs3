name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs the tests before it publishes the crates.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: rustup toolchain install
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Build
        run: cargo build --all-features
      - name: Run tests
        run: cargo nextest run --all-features --no-fail-fast

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: rustup toolchain install
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Check the formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  complexity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install lizard
        run: pip install --no-cache-dir lizard==1.24.0
      # Every function stays at or below a cyclomatic complexity of 10.
      - name: Check the complexity
        run: lizard -l rust -C 10 -w r3v3rs3/src r3v3rs3-api/src r3v3rs3-webui/src
