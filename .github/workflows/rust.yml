name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs the tests before it publishes the crates.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation helps local iteration but slows CI builds and bloats the cache.
  CARGO_INCREMENTAL: 0
  # Test binaries carry no debug info, so the target directory stays small and the cache
  # restores faster.
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: rustup toolchain install
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: tests
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run tests
        run: cargo nextest run --all-features --locked --no-fail-fast

  # The runner has a Docker Engine, so the ignored Docker runtime tests run against a real
  # one. They stay in their own job, so the two test sets run in parallel.
  test-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: tests
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run the Docker runtime tests
        run: cargo nextest run --all-features --locked --no-fail-fast --run-ignored only -E 'binary(runtime_docker_test) | binary(platform_deploy_test) | test(on_the_docker_engine)'

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust
        # rustup reads rust-toolchain.toml, so every job builds with the pinned channel.
        run: rustup toolchain install
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: clippy
      - name: Check the formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  complexity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install lizard
        run: pip install --no-cache-dir lizard==1.24.0
      # Every function stays at or below a cyclomatic complexity of 10.
      - name: Check the complexity
        run: lizard -l rust -C 10 -w r3v3rs3/src r3v3rs3-api/src r3v3rs3-webui/src
