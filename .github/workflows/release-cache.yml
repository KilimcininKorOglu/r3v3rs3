name: Warm release caches

# A tag run may restore only the caches of its own tag and of the default branch, so every
# release found no cache of the previous release and compiled all dependencies again. This
# workflow builds the WebUI and the server binaries on main with the setup of the webui and
# binary jobs in release.yml and saves the caches under the same keys, so the next tag run
# restores them.
#
# The cache key hashes the rustc version, every CARGO* environment variable and the
# dependencies of Cargo.toml and Cargo.lock (not the package versions). Keep the env block,
# the toolchain setup and the cache inputs equal to the webui and binary jobs of
# release.yml, or the release no longer finds these caches.
#
# The webui job also saves the built WebUI under the key of .github/scripts/webui-cache-key.sh.
# The release restores it and does not build the WebUI, so its server builds start at once.
# A push that changes a WebUI input runs this workflow, so the WebUI is ready before the tag.

on:
  schedule:
    # Daily. A run that finds an exact cache only restores it, which keeps the entry from
    # GitHub's 7-day eviction without building.
    - cron: "23 2 * * *"
  push:
    branches: [main]
    # A dependency or toolchain change gives a new key; warm it before the next release.
    # A source change of a library crate needs the release build of that commit in the cache.
    paths:
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - r3v3rs3/**
      - r3v3rs3-*/**
      - .github/scripts/webui-cache-key.sh
      - .github/scripts/workspace-cache.sh
      - .github/workflows/release.yml
      - .github/workflows/release-cache.yml
  workflow_dispatch:

permissions:
  contents: read

# A running warm-up finishes, because the caches are saved only at the end of a job: a cancel
# by the next push (a version bump right after the feature commit) would lose the WebUI build
# that the release then needs. The next run waits in the queue.
concurrency:
  group: release-cache
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  webui:
    name: Warm WebUI cache
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: WebUI cache key
        id: webui-key
        run: echo "key=webui-dist-$(bash .github/scripts/webui-cache-key.sh)" >> "$GITHUB_OUTPUT"
      - name: WebUI build cache
        # Saves the built WebUI at the end of the job when the key is new.
        id: webui-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: r3v3rs3/dist/webui
          key: ${{ steps.webui-key.outputs.key }}
      - name: Install Rust
        run: rustup toolchain install
      - name: Cache
        # Restoring keeps the dependency cache of the release fallback build from eviction. The
        # job saves it only when it builds, so a restored WebUI never saves an empty target.
        id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: r3v3rs3-webui
          shared-key: wasm-webui
          save-if: ${{ steps.webui-cache.outputs.cache-hit != 'true' }}
      - name: Install cargo-binstall
        if: steps.webui-cache.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install trunk
        if: steps.webui-cache.outputs.cache-hit != 'true'
        # The same token and --locked as the trunk step of release.yml.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall trunk@0.21.14 --locked --force -y
      - name: Build webui
        if: steps.webui-cache.outputs.cache-hit != 'true'
        run: cd r3v3rs3-webui && trunk build --cargo-profile web-release --release

  warm:
    name: Warm release cache (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Deletes the library crate cache of the previous commit.
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # workspace-cache.sh compares this commit with the commit of the cached crates.
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}-2.17
      - name: Library crate cache
        # Restores the library crates of the newest main commit and saves those of this commit
        # at the end of the job. Its save runs before the cleanup of rust-cache, which drops the
        # workspace crates, because post steps run in reverse order. The tag run of release.yml
        # restores it, so a release compiles only r3v3rs3 and r3v3rs3-cli after a version bump.
        # Keep the paths equal to release.yml. The daily run of an unchanged main finds the exact
        # key and builds nothing.
        id: crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: workspace-crates-${{ matrix.target }}-${{ github.sha }}
          restore-keys: workspace-crates-${{ matrix.target }}-
          path: |
            .workspace-cache
            target/release/build/r3v3rs3-core-*
            target/release/.fingerprint/r3v3rs3-core-*
            target/${{ matrix.target }}/release/deps/*r3v3rs3_api-*
            target/${{ matrix.target }}/release/deps/*r3v3rs3_core-*
            target/${{ matrix.target }}/release/deps/*r3v3rs3_proxy-*
            target/${{ matrix.target }}/release/deps/*r3v3rs3_platform-*
            target/${{ matrix.target }}/release/deps/*r3v3rs3_server-*
            target/${{ matrix.target }}/release/deps/*r3v3rs3_admin-*
            target/${{ matrix.target }}/release/.fingerprint/r3v3rs3-api-*
            target/${{ matrix.target }}/release/.fingerprint/r3v3rs3-core-*
            target/${{ matrix.target }}/release/.fingerprint/r3v3rs3-proxy-*
            target/${{ matrix.target }}/release/.fingerprint/r3v3rs3-platform-*
            target/${{ matrix.target }}/release/.fingerprint/r3v3rs3-server-*
            target/${{ matrix.target }}/release/.fingerprint/r3v3rs3-admin-*
            target/${{ matrix.target }}/release/build/r3v3rs3-core-*
      - name: Mark the unchanged sources of the cached crates
        if: steps.crates.outputs.cache-hit != 'true'
        run: bash .github/scripts/workspace-cache.sh restore
      - name: Install cargo-binstall
        if: steps.crates.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624 # v1.23.0
      - name: Install zig and cargo-zigbuild
        if: steps.crates.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install ziglang==0.17.0
          cargo binstall cargo-zigbuild@0.23.4 --locked --force -y
      - name: Build the server and the command line client for glibc 2.17
        # The cached crates do not embed the WebUI, so the empty dist directory of the
        # repository is enough here; the release embeds the real WebUI in r3v3rs3.
        if: steps.crates.outputs.cache-hit != 'true'
        run: cargo zigbuild --release --locked -p r3v3rs3 -p r3v3rs3-cli --target ${{ matrix.target }}.2.17
      - name: Record the commit of the cached crates
        if: steps.crates.outputs.cache-hit != 'true'
        run: bash .github/scripts/workspace-cache.sh record
      - name: Delete the library crate caches of older commits
        # GitHub keeps at most 10 GB of caches per repository; one entry per target is enough,
        # because the next run restores the newest. This commit's entry is saved after this step.
        if: steps.crates.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PREFIX: workspace-crates-${{ matrix.target }}-
        run: |
          gh cache list --key "$PREFIX" --limit 100 --json key --jq '.[].key' |
            while IFS= read -r key; do
              gh cache delete "$key"
            done
