name: Create and publish a Docker image

on:
  push:
    tags:
      - "v*"
  # A manual run builds both platforms and publishes nothing.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # Each platform builds on a native runner, because building the server under QEMU takes hours.
  # Both `runtime` and `platform` targets build sequentially on the same runner so `platform`
  # reuses the local BuildKit cache immediately without network cache transfer overhead.
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push runtime by digest
        id: build-runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Build and push platform by digest
        id: build-platform
        uses: docker/build-push-action@v7
        with:
          context: .
          target: platform
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
      - name: Export digests
        if: github.event_name == 'push'
        run: |
          mkdir -p "${{ runner.temp }}/digests-runtime" "${{ runner.temp }}/digests-platform"
          rt_digest="${{ steps.build-runtime.outputs.digest }}"
          pl_digest="${{ steps.build-platform.outputs.digest }}"
          touch "${{ runner.temp }}/digests-runtime/${rt_digest#sha256:}"
          touch "${{ runner.temp }}/digests-platform/${pl_digest#sha256:}"
      - name: Upload runtime digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digests-runtime-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests-runtime/*
          if-no-files-found: error
          retention-days: 1
      - name: Upload platform digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: digests-platform-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests-platform/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-platform ${{ matrix.target }} image
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: platform
            suffix: -platform
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Prepare
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `onlatest` gives the platform image `latest-platform`, so it never takes `latest`.
          flavor: |
            suffix=${{ matrix.suffix }}
            onlatest=true
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Inspect image
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
