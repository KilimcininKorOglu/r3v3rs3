[package]
name = "r3v3rs3-admin"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The admin API of the r3v3rs3 server: the HTTP routes, the MCP endpoint, OAuth and the embedded WebUI."
authors = ["KilimcininKorOglu <k@keremgok.tr>", "picoHz <picoHz@outlook.com>"]

[dependencies]
r3v3rs3-server.workspace = true
anyhow.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
axum-extra.workspace = true
base64.workspace = true
brotli.workspace = true
bytes.workspace = true
flate2.workspace = true
fnv.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
include_dir.workspace = true
ipnet.workspace = true
libc.workspace = true
log.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
r3v3rs3-api.workspace = true
rand.workspace = true
reqwest.workspace = true
rmcp.workspace = true
sailfish.workspace = true
schemars.workspace = true
serde.workspace = true
serde_derive.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower_governor.workspace = true
tower-http.workspace = true
tracing.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true
zstd.workspace = true

[dev-dependencies]
# The unit tests run without the binary that sets the release version.
r3v3rs3-core = { workspace = true, features = ["test-util"] }
# A local mock of the CT API, and a paused clock that runs a slow CT log server at once.
r3v3rs3-api = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
# The crypto provider that the server installs at start, for the HTTP clients of the tests.
tokio-rustls.workspace = true
