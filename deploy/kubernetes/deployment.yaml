apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: r3v3rs3-config
  namespace: r3v3rs3
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r3v3rs3
  namespace: r3v3rs3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: r3v3rs3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: r3v3rs3
    spec:
      serviceAccountName: r3v3rs3
      containers:
        - name: r3v3rs3
          image: ghcr.io/kilimcininkoroglu/r3v3rs3:latest
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: admin
              containerPort: 46492
          volumeMounts:
            - name: config
              mountPath: /root/.config/r3v3rs3
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: r3v3rs3-config
---
apiVersion: v1
kind: Service
metadata:
  name: r3v3rs3
  namespace: r3v3rs3
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: r3v3rs3
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
