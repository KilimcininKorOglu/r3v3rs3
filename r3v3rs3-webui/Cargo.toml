[package]
name = "r3v3rs3-webui"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "0.2.93"
console_error_panic_hook = "0.1.7"
yew-router = "0.20.0"
gloo-net = "0.7.0"
wasm-bindgen-futures = "0.4.37"
r3v3rs3-api = "0.2.6"
serde_json = "1.0.102"
gloo-utils = "0.3.0"
serde_derive = "1.0.171"
serde = "1.0.171"
yewdux = "0.13.0"
web-sys = { version = "0.3.64", features = ["console", "Document", "DomTokenList", "Element", "HtmlDocument", "HtmlSelectElement", "HtmlTextAreaElement", "MediaQueryList", "Window"] }
futures = "0.3.28"
gloo-dialogs = "0.3.0"
gloo-timers = "0.4.0"
url = "2.4.0"
base64 = "0.23.1"
time = { version = "0.3.36", features = ["formatting"] }
gloo-events = "0.3.0"
web-time = "1.0.0"
