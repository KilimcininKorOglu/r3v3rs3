<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>r3v3rs3 Admin</title>

    <link data-trunk rel="copy-file" href="robots.txt"/>
    <link data-trunk rel="copy-dir" href="assets"/>
    <link data-trunk rel="tailwind-css" href="src/tailwind.css"/>
    <base data-trunk-public-url />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#101010">
    <meta name="msapplication-config" content="/assets/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#ffc40d">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex" />
    <script>
        // Applies the language and the theme before the WebUI loads, so the page does not change
        // color after the first paint. src/preferences.rs applies the values that the user selects.
        (function () {
            var lang = document.cookie.match(/(?:^|;\s*)r3v3rs3_lang=([a-z]+)/);
            document.documentElement.lang = lang && lang[1] === "tr" ? "tr" : "en";
            var query = window.matchMedia("(prefers-color-scheme: dark)");
            function apply() {
                var match = document.cookie.match(/(?:^|;\s*)r3v3rs3_theme=([a-z]+)/);
                var theme = match ? match[1] : "system";
                var dark = theme === "dark" || (theme !== "light" && query.matches);
                document.documentElement.classList.toggle("dark", dark);
                document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#333333" : "#ffffff");
            }
            apply();
            query.addEventListener("change", apply);
        })();
    </script>
</head>

<body>
    <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" data-bin="r3v3rs3-webui" />
</body>

</html>
