# Supply-chain policy for cargo-deny. Run it with `cargo deny check`.

[graph]
# The project supports Linux only, so another target's dependencies are not checked.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # rsa: Marvin Attack timing sidechannel. No patched release exists. rsa is a direct
    # dev-dependency of r3v3rs3 that generates RSA test keys, so the released binary does not
    # carry it.
    "RUSTSEC-2023-0071",
    # libsqlite3-sys < 0.39 (bundled SQLite < 3.54): a crafted database and -wal pair with
    # mismatched page sizes can leak page-cache memory. sqlx-sqlite 0.9.0 caps libsqlite3-sys
    # below 0.38 and no newer sqlx exists. r3v3rs3 opens only the databases in its own config
    # directory (mode 0700, owned by the service account), so an attacker who can plant the pair
    # already has that account. Remove this entry when a sqlx release allows 0.39.
    "RUSTSEC-2026-0459",
    # The crates below have no maintained release. Each one is a transitive dependency. Check
    # for a new release of the crate that pulls it in before every release.
    "RUSTSEC-2025-0141", # bincode 1.x, through gloo-worker of yew (WebUI)
    "RUSTSEC-2024-0370", # proc-macro-error, through yew-macro and yewdux-macros (WebUI)
    "RUSTSEC-2024-0449", # unsafe-libyaml, unmaintained transitive dependency of serde_yaml_ng
]

[licenses]
# Every license below appears in the dependency tree. MPL-2.0 is file-level copyleft, and the
# project uses those crates unmodified.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # A data license, not a code license. It covers the Mozilla CA root store of webpki-roots.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# webpki 0.22 carries the ISC text in its LICENSE file and declares no license field.
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# r3v3rs3-cli is publish = false and takes r3v3rs3-api by path, so its version follows the
# workspace. A published crate still gets the wildcard error.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
