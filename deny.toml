# Supply-chain policy for cargo-deny. Run it with `cargo deny check`.

[graph]
# The project supports Linux only, so another target's dependencies are not checked.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "wasm32-unknown-unknown" },
]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # rsa: Marvin Attack timing sidechannel. No patched release exists. The crate arrives through
    # sqlx-mysql as a dev-dependency only, and the released binary does not carry it.
    "RUSTSEC-2023-0071",
    # The crates below have no maintained release. Each one is a transitive dependency.
    "RUSTSEC-2025-0141", # bincode 1.x
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2025-0134", # rustls-pemfile
]

[licenses]
# Every license below appears in the dependency tree. MPL-2.0 is file-level copyleft, and the
# project uses those crates unmodified.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # A data license, not a code license. It covers the Mozilla CA root store of webpki-roots.
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[[licenses.clarify]]
# webpki 0.22 carries the ISC text in its LICENSE file and declares no license field.
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
