[package]
name = "r3v3rs3-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The shared base of the r3v3rs3 server: configuration, storage, accounts, certificates, discovery and the server commands."
authors = ["KilimcininKorOglu <k@keremgok.tr>", "picoHz <picoHz@outlook.com>"]
