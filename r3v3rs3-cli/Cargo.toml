[package]
name = "r3v3rs3-cli"
version = "2.0.2"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/KilimcininKorOglu/r3v3rs3"
description = "A command line client for the r3v3rs3 admin API"
authors = ["KilimcininKorOglu <k@keremgok.tr>"]

[dependencies]
anyhow = "1.0.71"
base64 = "0.23.1"
clap = { version = "4.3.11", features = ["derive", "env"] }
dirs = "6.0.0"
flate2 = "1.1.0"
hex = "0.4.3"
rand = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "form",
] }
rmcp = { version = "3.5.1", features = [
    "client",
    "transport-streamable-http-client-reqwest",
] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "logging"] }
serde = { version = "1.0.171", features = ["derive"] }
serde_json = "1.0.102"
serde_yaml = "0.9"
sha2 = "0.11.0"
tar = "0.4.38"
tokio = { version = "1.29.1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
url = "2.4.0"
webbrowser = "1.0.0"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
